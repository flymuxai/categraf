# Monitor a sub2api API key's remaining balance/quota via /v1/usage.
# One instance = one API key. Defaults to 5m interval.
interval = "5m"

[[instances]]
name     = "prod-wallet-key"
base_url = "https://supplier.example.com"

# The only credential. Use a dedicated API key created for monitoring; the
# raw key is never emitted in metrics or logs.
api_key = "@{env:SUB2API_API_KEY}"

# Applies to the actual upstream request after limiter waiting completes.
timeout              = "10s"
response_limit_bytes = 8388608

# Shared token-bucket for all requests to this upstream origin.
request_rps_limit = 1.0
request_burst     = 1

# Optional supplemental collections. Each adds one HTTP call per interval.
# collect_billing = true   # GET /v1/sub2api/billing — per-key rate multipliers
# collect_models  = true   # GET /v1/models — advertised model list

# Optional: propagated as the `timezone` query on /v1/usage. Only affects
# how the server buckets daily_usage — not the balance itself.
# usage_timezone = "Asia/Shanghai"

# HTTP/TLS options supported by Categraf HTTP inputs.
# http_proxy = "http://127.0.0.1:8080"
# use_tls = true
# tls_ca = "/etc/categraf/ca.pem"
# insecure_skip_verify = false

interval_times = 1
